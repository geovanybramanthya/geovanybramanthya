<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="220">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#090E1A" />
      <stop offset="100%" stop-color="#060A14" />
    </linearGradient>
    <radialGradient id="radialGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.10" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="850" height="220" rx="14" fill="url(#bgGradient)" />
  <rect width="850" height="220" rx="14" fill="url(#radialGlow)" />
  <rect width="848" height="218" x="1" y="1" rx="13" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.8" />

  <!-- Background Coordinate Grid (Mathematical Texture) -->
  <g stroke="#1E293B" stroke-width="0.6" stroke-dasharray="3,5" stroke-opacity="0.4">
    <line x1="40" y1="40" x2="40" y2="180" />
    <line x1="90" y1="40" x2="90" y2="180" />
    <line x1="140" y1="40" x2="140" y2="180" />
    <line x1="190" y1="40" x2="190" y2="180" />
    <line x1="660" y1="40" x2="660" y2="180" />
    <line x1="710" y1="40" x2="710" y2="180" />
    <line x1="760" y1="40" x2="760" y2="180" />
    <line x1="810" y1="40" x2="810" y2="180" />
    <line x1="30" y1="70" x2="220" y2="70" />
    <line x1="30" y1="110" x2="220" y2="110" />
    <line x1="30" y1="150" x2="220" y2="150" />
    <line x1="630" y1="70" x2="820" y2="70" />
    <line x1="630" y1="110" x2="820" y2="110" />
    <line x1="630" y1="150" x2="820" y2="150" />
  </g>

  <!-- Left Side: Dynamic Stochastic Waves and Gaussian Density -->
  <g>
    <!-- Gaussian / Stochastic Wave 1 -->
    <path fill="none" stroke="url(#waveGrad1)" stroke-width="1.8" filter="url(#glow)">
      <animate attributeName="d" dur="8s" repeatCount="indefinite"
        values="
          M 20,150 Q 60,140 100,80 T 170,110 T 240,155;
          M 20,155 Q 65,110 110,65 T 175,130 T 240,150;
          M 20,148 Q 55,130 95,95 T 165,85 T 240,158;
          M 20,150 Q 60,140 100,80 T 170,110 T 240,155
        " />
    </path>

    <!-- Gaussian / Stochastic Wave 2 -->
    <path fill="none" stroke="url(#waveGrad2)" stroke-width="1.4" stroke-dasharray="4,3">
      <animate attributeName="d" dur="11s" repeatCount="indefinite"
        values="
          M 20,160 Q 70,130 115,100 T 180,90 T 240,165;
          M 20,158 Q 60,150 105,75 T 165,115 T 240,160;
          M 20,162 Q 75,120 120,110 T 185,80 T 240,168;
          M 20,160 Q 70,130 115,100 T 180,90 T 240,165
        " />
    </path>

    <!-- Pulsing Data Nodes on Curves -->
    <circle cx="100" cy="80" r="3.5" fill="#38BDF8" filter="url(#glow)">
      <animate attributeName="cy" values="80; 65; 95; 80" dur="8s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5; 5; 3; 3.5" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="170" cy="110" r="3" fill="#818CF8">
      <animate attributeName="cy" values="110; 130; 85; 110" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="55" cy="135" r="2.5" fill="#34D399">
      <animate attributeName="cy" values="135; 120; 140; 135" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Right Side: Complex Credit & Graph Network (Bimodal Graph Structure) -->
  <g stroke="#38BDF8" stroke-width="0.8">
    <!-- Network Edges with Dynamic Opacity and Shift -->
    <line x1="650" y1="130" x2="700" y2="75" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.2; 0.6; 0.2" dur="5s" repeatCount="indefinite" />
      <animate attributeName="y2" values="75; 68; 75" dur="7s" repeatCount="indefinite" />
    </line>
    <line x1="700" y1="75" x2="760" y2="110" stroke-opacity="0.4">
      <animate attributeName="stroke-opacity" values="0.4; 0.15; 0.4" dur="6s" repeatCount="indefinite" />
    </line>
    <line x1="700" y1="75" x2="735" y2="160" stroke-opacity="0.25">
      <animate attributeName="stroke-opacity" values="0.15; 0.5; 0.15" dur="4.5s" repeatCount="indefinite" />
    </line>
    <line x1="760" y1="110" x2="815" y2="80" stroke-opacity="0.35">
      <animate attributeName="y1" values="110; 118; 110" dur="8s" repeatCount="indefinite" />
    </line>
    <line x1="760" y1="110" x2="790" y2="155" stroke-opacity="0.3">
      <animate attributeName="stroke-opacity" values="0.3; 0.7; 0.3" dur="5.5s" repeatCount="indefinite" />
    </line>
    <line x1="735" y1="160" x2="790" y2="155" stroke-opacity="0.25" />
    <line x1="650" y1="130" x2="735" y2="160" stroke-opacity="0.3">
      <animate attributeName="stroke-opacity" values="0.3; 0.1; 0.3" dur="7s" repeatCount="indefinite" />
    </line>
    <line x1="680" y1="170" x2="735" y2="160" stroke-opacity="0.2" />

    <!-- Graph Network Nodes -->
    <circle cx="650" cy="130" r="3.5" fill="#6366F1" filter="url(#glow)">
      <animate attributeName="r" values="3.5; 5; 3.5" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="700" cy="75" r="4.5" fill="#38BDF8" filter="url(#glow)">
      <animate attributeName="cy" values="75; 68; 75" dur="7s" repeatCount="indefinite" />
      <animate attributeName="r" values="4.5; 6; 4.5" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="760" cy="110" r="4" fill="#10B981" filter="url(#glow)">
      <animate attributeName="cy" values="110; 118; 110" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="735" cy="160" r="3" fill="#818CF8" />
    <circle cx="815" cy="80" r="3.5" fill="#38BDF8">
      <animate attributeName="r" values="3.5; 2.5; 3.5" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="790" cy="155" r="3" fill="#34D399" />
    <circle cx="680" cy="170" r="2" fill="#94A3B8" />
  </g>

  <!-- Central Brand & Identity Block -->
  <g>
    <!-- Callsign Pill Badge -->
    <rect x="385" y="28" width="80" height="20" rx="10" fill="#6366F1" fill-opacity="0.15" stroke="#818CF8" stroke-width="1" stroke-opacity="0.5" />
    <text x="425" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="800" letter-spacing="2.8" fill="#A5B4FC">AZURA</text>

    <!-- Main Title (Full Name) -->
    <text x="425" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="27" font-weight="800" letter-spacing="0.3" fill="#FFFFFF">Geovany Bramanthya Samuel Sihombing</text>

    <!-- Subtitle (Specialization Domain) -->
    <text x="425" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="2.5" fill="#38BDF8">STATISTICS &amp; QUANTITATIVE COMPUTING</text>

    <!-- Sub-tagline -->
    <text x="425" y="146" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" letter-spacing="0.6" fill="#94A3B8">Actuarial Mathematics  •  ESG Risk Analytics  •  Deep Learning</text>

    <!-- Minimal Horizon Divider -->
    <line x1="310" y1="170" x2="540" y2="170" stroke="url(#lineGrad)" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="425" cy="170" r="2.5" fill="#38BDF8" filter="url(#glow)" />
  </g>
</svg>
