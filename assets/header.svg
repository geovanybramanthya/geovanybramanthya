    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="13" font-weight="400" letter-spacing="0.2" fill="#94A3B8">Actuarial Mathematics  •  Credit Risk Architectures  •  Stochastic Inference</text>

