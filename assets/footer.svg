<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 40" width="100%" height="40">
  <defs>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050811" stop-opacity="0" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#34D399" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </linearGradient>
    <filter id="glowF">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <line x1="60" y1="20" x2="790" y2="20" stroke="url(#footerGrad)" stroke-width="1.2" filter="url(#glowF)" />
  <circle cx="425" cy="20" r="3" fill="#6366F1" filter="url(#glowF)">
    <animate attributeName="r" values="3; 4.5; 3" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="365" cy="20" r="2" fill="#38BDF8" />
  <circle cx="485" cy="20" r="2" fill="#34D399" />
</svg>
